name: Publish package to GitHub Packages

# Publica @jcmartinezma/jcbrand solo en GitHub Packages (https://npm.pkg.github.com).
# No publica en registry.npmjs.org y no usa --access public.
# El paquete nace privado y hereda los permisos del repo privado jcmartinezma/jcbrand
# porque package.json.repository apunta a ese repo.
#
# Cuándo corre:
# - Al publicar un GitHub Release (no un draft).
# - A mano: Actions → este workflow → Run workflow.
#
# La versión que se sube es la de package.json. npm rechaza repetir una versión.
# En un Release, el tag tiene que ser v<version> (v0.1.0 si package.json dice 0.1.0).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@jcmartinezma"

      - name: Install dependencies
        run: npm ci

      - name: Build and verify tokens
        run: npm run build:tokens

      - name: Check release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag" ]; then
            echo "::error::package.json version ($pkg_version) does not match release tag ($GITHUB_REF_NAME). Expected v$pkg_version."
            exit 1
          fi

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
