name: CI

# Este repo se instala como dependencia directa de GitHub, así que lo que hay
# en el repo es lo que se instala. No se publica en ningún registro.
# Este workflow solo comprueba que dist/ (que se commitea) coincide con tokens/.
#
# Cuándo corre:
# - En cada push a main y en cada pull request.
# - Al publicar un GitHub Release: además comprueba que el tag es v<version>.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Validate token JSON
        run: npm run check:tokens

      - name: Build tokens and verify the output
        run: npm run build:tokens

      - name: Check that dist/ is committed and up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ no coincide con tokens/. Ejecuta 'npm run build:tokens' y commitea dist/."
            git status --short -- dist
            exit 1
          fi

      - name: Check release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag" ]; then
            echo "::error::package.json version ($pkg_version) does not match release tag ($GITHUB_REF_NAME). Expected v$pkg_version."
            exit 1
          fi
